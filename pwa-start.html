<script>
(async () => {
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('./sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
    } catch (error) {
      console.warn('Service Worker kaydı başarısız:', error);
    }
  }
  window.location.replace('./index.html');
})();
</script>
